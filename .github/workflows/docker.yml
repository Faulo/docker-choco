name: Docker

on:
  push:
    branches:
      - main
    paths:
      - common/**
      - windows/**
      - .dockerignore
      - Directory.Build.props
      - docker-choco.sln
      - global.json
      - .github/workflows/docker.yml
  workflow_dispatch:
  schedule:
    - cron: '41 3 1 * *'

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-tool:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - name: Publish choco-install
        shell: pwsh
        run: |
          dotnet publish docker-choco.sln --configuration Release --runtime win-x64 --self-contained true --property:PublishSingleFile=true --property:InvariantGlobalization=true --property:DebugType=None
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path common/ChocoInstall/bin/Release/net9.0/win-x64/publish/choco-install.exe)) { throw 'choco-install.exe was not produced' }
  publish:
    needs: build-tool
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: windows-ltsc2019
            base: mcr.microsoft.com/windows:ltsc2019
            chocolatey: '1.4.0'
          - tag: windowsservercore-ltsc2019
            base: mcr.microsoft.com/dotnet/framework/runtime:4.8-windowsservercore-ltsc2019
            chocolatey: '2.7.4'
          - tag: windows-ltsc2022
            base: mcr.microsoft.com/windows/server:ltsc2022
            chocolatey: '2.7.4'
          - tag: windowsservercore-ltsc2022
            base: mcr.microsoft.com/windows/servercore:ltsc2022
            chocolatey: '2.7.4'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
      DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Docker
        shell: pwsh
        run: |
          $service = Get-Service docker
          if ($service.Status -ne 'Running') { Start-Service docker }
          docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build image
        shell: pwsh
        env:
          BASE_IMAGE: ${{matrix.base}}
          CHOCOLATEY_VERSION: ${{matrix.chocolatey}}
          IMAGE_TAG: ${{matrix.tag}}
        run: |
          docker build --isolation=hyperv --platform windows/amd64 --pull --file windows/Dockerfile --build-arg "BASE_IMAGE=$env:BASE_IMAGE" --build-arg "CHOCOLATEY_VERSION=$env:CHOCOLATEY_VERSION" --tag "tmp/choco:$env:IMAGE_TAG" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Push image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        shell: pwsh
        env:
          IMAGE_TAG: ${{matrix.tag}}
        run: |
          $target = "faulo/choco:$env:IMAGE_TAG"
          docker image tag "tmp/choco:$env:IMAGE_TAG" $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker image push $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
