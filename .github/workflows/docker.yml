name: Docker

on:
  workflow_dispatch:
    inputs:
      core_only:
        description: Validate only Server Core
        type: boolean
        default: false
      published_only:
        description: Test the published delayed-startup baseline without building
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: issue-9-candidate-${{ github.ref }}-${{ inputs.core_only }}
  cancel-in-progress: false

jobs:
  candidate-2022:
    name: Validation (${{ inputs.published_only && 'published' || 'candidate' }}, ${{ matrix.variant }})
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.core_only && '[{"variant":"windowsservercore-ltsc2022","base":"mcr.microsoft.com/windows/servercore:ltsc2022"}]' || '[{"variant":"windows-ltsc2022","base":"mcr.microsoft.com/windows/server:ltsc2022"},{"variant":"windowsservercore-ltsc2022","base":"mcr.microsoft.com/windows/servercore:ltsc2022"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out runner preparation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Faulo/workflows-docker
          ref: v3
          path: .reports/workflow
          persist-credentials: false
      - name: Reclaim Visual Studio disk space
        env:
          CLEANUP_WINDOWS_RUNNER: 'true'
        run: python .reports/workflow/scripts/prepare_windows_runner.py
      - name: Prepare Windows Docker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Service docker).Status -ne 'Running') { Start-Service docker }
          docker context create windows --docker host=npipe:////./pipe/docker_engine
          if ($LASTEXITCODE) { throw 'Cannot create Windows Docker context' }
          for ($attempt = 1; $attempt -le 24; $attempt++) {
              $os = docker --context windows info --format '{{.OSType}}' 2>$null
              if ($LASTEXITCODE -eq 0 -and $os.Trim() -eq 'windows') { break }
              if ($attempt -eq 24) { throw 'Windows Docker daemon did not become ready' }
              Start-Sleep -Seconds 5
          }
          $environment = Get-Content .env -Raw
          $environment = $environment -replace '(?m)^DOCKER_ARGS_WINDOWS=.*$', 'DOCKER_ARGS_WINDOWS=--isolation=hyperv'
          Set-Content .env $environment
      - name: Authenticate image pulls
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $env:DOCKERHUB_TOKEN | docker --context windows login --username $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE) { throw 'Docker Hub authentication failed' }
      - name: Build candidate
        if: ${{ !inputs.published_only }}
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
          BASE_IMAGE: ${{ matrix.base }}
          DOCKER_BUILDKIT: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $configuration = ConvertFrom-StringData (Get-Content .env -Raw)
          $imageName = $configuration.DOCKER_IMAGE
          $published = $configuration.DOCKER_NAMESPACE + '/' + $imageName + ':' + $env:VARIANT
          $candidate = 'tmp/' + $imageName + ':' + $env:VARIANT
          docker --context windows pull $published
          if ($LASTEXITCODE) { throw 'Cannot pull the published build cache' }
          docker --context windows build --pull --isolation hyperv --cache-from $published --build-arg "BASE_IMAGE=$env:BASE_IMAGE" --file windows/Dockerfile --tag $candidate .
          if ($LASTEXITCODE) { throw 'Candidate build failed' }
          docker --context windows image inspect $candidate --format '{{.Id}} {{.OsVersion}}'
          if ($LASTEXITCODE) { throw 'Candidate inspection failed' }
      - name: Verify WinHTTP regression
        if: ${{ !inputs.published_only }}
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          & ./.jenkins/Invoke-IntegrationTests.ps1 -Namespace tmp -Context windows -Variant $env:VARIANT -TestsPath tests/WinHttp.Tests.ps1 -ResultsPath .reports/winhttp.xml
          if ($LASTEXITCODE) { throw 'WinHTTP candidate regression failed' }
      - name: Test complete candidate
        if: ${{ !inputs.published_only }}
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          & ./.jenkins/Invoke-IntegrationTests.ps1 -Namespace tmp -Context windows -Variant $env:VARIANT -ResultsPath .reports/integration.xml
          if ($LASTEXITCODE) { throw 'Complete candidate integration failed' }
      - name: Test published delayed-startup contract
        if: ${{ inputs.published_only }}
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          $failed = $false
          foreach ($test in @('KernelPool')) {
              & ./.jenkins/Invoke-IntegrationTests.ps1 -Pull -Context windows -Variant $env:VARIANT -TestsPath "tests/$test.Tests.ps1" -ResultsPath ".reports/$test.xml"
              if ($LASTEXITCODE) { $failed = $true }
          }
          if ($failed) { throw 'Published image does not satisfy the delayed-startup contract' }
      - name: Store integration reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.variant }}
          path: |
            .reports/winhttp.xml
            .reports/integration.xml
            .reports/KernelPool.xml
          if-no-files-found: warn
