name: Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  docker:
    uses: Faulo/workflows-docker/.github/workflows/docker.yml@v3
    with:
      config: docker.json
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  integration-2022:
    name: Integration (${{ matrix.variant }})
    needs: docker
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant:
          - windows-ltsc2022
          - windowsservercore-ltsc2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Windows Docker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Service docker).Status -ne 'Running') { Start-Service docker }
          docker context create windows --docker host=npipe:////./pipe/docker_engine
          if ($LASTEXITCODE) { throw 'Cannot create Windows Docker context' }
          for ($attempt = 1; $attempt -le 24; $attempt++) {
              $os = docker --context windows info --format '{{.OSType}}' 2>$null
              if ($LASTEXITCODE -eq 0 -and $os.Trim() -eq 'windows') { break }
              if ($attempt -eq 24) { throw 'Windows Docker daemon did not become ready' }
              Start-Sleep -Seconds 5
          }
          # The newer runner needs a matching guest kernel for LTSC 2022.
          $environment = Get-Content .env -Raw
          $environment = $environment -replace '(?m)^DOCKER_ARGS_WINDOWS=.*$', 'DOCKER_ARGS_WINDOWS=--isolation=hyperv'
          Set-Content .env $environment
      - name: Authenticate image pulls
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $env:DOCKERHUB_TOKEN | docker --context windows login --username $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE) { throw 'Docker Hub authentication failed' }
      - name: Test published image
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          & ./.jenkins/Invoke-IntegrationTests.ps1 -Pull -Context windows -Variant $env:VARIANT -ResultsPath .reports/integration.xml
      - name: Store integration report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ matrix.variant }}
          path: .reports/integration.xml
          if-no-files-found: warn
