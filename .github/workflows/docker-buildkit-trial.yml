name: PowerShell parent detection trial

on:
  push:
    branches: [fix/4-powershell-parent-detection]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sequence: [package, dependencies]
    steps:
      - uses: actions/checkout@v7
      - name: Select Windows daemon
        shell: pwsh
        run: |
          Start-Service docker
          docker context create windows --docker host=npipe:////./pipe/docker_engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker --context windows version
          Get-ComputerInfo -Property OsName, OsVersion, WindowsVersion
      - name: Reproduce on the reported published base
        shell: pwsh
        run: |
          docker --context windows build --isolation=hyperv --build-arg SEQUENCE=${{ matrix.sequence }} --tag tmp/choco:parent-baseline-${{ matrix.sequence }} --file tests/reproductions/powershell-core/Dockerfile .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
