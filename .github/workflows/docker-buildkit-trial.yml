name: PowerShell parent detection trial

on:
  push:
    branches: [fix/4-powershell-parent-detection]
  workflow_dispatch:
    inputs:
      validation:
        description: Validate a local candidate or the published images
        type: choice
        default: candidate
        options: [candidate, published]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test --logger junit
  candidate:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      IMAGE_NAMESPACE: ${{ inputs.validation == 'published' && 'faulo' || 'tmp' }}
    strategy:
      fail-fast: false
      matrix:
        variant: [windows-ltsc2019, windowsservercore-ltsc2019, windows-ltsc2022, windowsservercore-ltsc2022]
    steps:
      - uses: actions/checkout@v7
      - name: Select Windows daemon
        shell: pwsh
        run: |
          Start-Service docker
          docker context create windows --docker host=npipe:////./pipe/docker_engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker --context windows version
          Get-ComputerInfo -Property OsName, OsVersion, WindowsVersion
      - name: Build the compatibility candidate without publication
        if: inputs.validation != 'published'
        shell: pwsh
        run: |
          $variant = '${{ matrix.variant }}'
          $osBase = ($variant -split '-')[-1]
          $family = ($variant -split '-')[0]
          $baseImage = if ($family -eq 'windowsservercore') {
            "mcr.microsoft.com/windows/servercore:$osBase"
          } elseif ($osBase -eq 'ltsc2022') {
            "mcr.microsoft.com/windows/server:$osBase"
          } else {
            "mcr.microsoft.com/windows:$osBase"
          }
          docker --context windows build --isolation=hyperv --build-arg OS_BASE=$osBase --build-arg BASE_IMAGE=$baseImage --tag tmp/choco:$variant --file windows/Dockerfile .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pull the published image
        if: inputs.validation == 'published'
        shell: pwsh
        run: |
          docker --context windows pull faulo/choco:${{ matrix.variant }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all image integration tests
        shell: pwsh
        run: |
          $environment = Get-Content .env -Raw
          $environment -replace '(?m)^DOCKER_ARGS_WINDOWS=.*$', 'DOCKER_ARGS_WINDOWS=--isolation=hyperv' | Set-Content .env
          pwsh ./.jenkins/Invoke-IntegrationTests.ps1 -Namespace $env:IMAGE_NAMESPACE -Context windows -Variant ${{ matrix.variant }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay the failed package and dependency sequence
        shell: pwsh
        run: |
          foreach ($sequence in @('package', 'dependencies')) {
            $baseImage = "$env:IMAGE_NAMESPACE/choco:${{ matrix.variant }}"
            docker --context windows build --isolation=hyperv --build-arg BASE_IMAGE=$baseImage --build-arg SEQUENCE=$sequence --tag tmp/choco:replay-${{ matrix.variant }}-$sequence --file tests/reproductions/powershell-core/Dockerfile .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Store contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-integration-${{ matrix.variant }}
          path: .reports/report.xml
          if-no-files-found: warn
