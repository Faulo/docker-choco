name: Docker build trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    uses: Faulo/workflows-docker/.github/workflows/docker.yml@v2
    with:
      config: docker.json
      publish: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
