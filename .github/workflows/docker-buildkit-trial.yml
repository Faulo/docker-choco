name: PowerShell parent detection trial

on:
  push:
    branches: [fix/4-powershell-parent-detection]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [windows-ltsc2019, windowsservercore-ltsc2019, windows-ltsc2022, windowsservercore-ltsc2022]
    steps:
      - uses: actions/checkout@v7
      - name: Select Windows daemon
        shell: pwsh
        run: |
          Start-Service docker
          docker context create windows --docker host=npipe:////./pipe/docker_engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker --context windows version
          Get-ComputerInfo -Property OsName, OsVersion, WindowsVersion
      - name: Build the compatibility candidate without publication
        shell: pwsh
        run: |
          docker --context windows build --isolation=hyperv --build-arg BASE_IMAGE=faulo/choco:${{ matrix.variant }} --tag tmp/choco:${{ matrix.variant }} --file tests/reproductions/powershell-core/Candidate.Dockerfile .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the PowerShell contract against the candidate
        shell: pwsh
        run: |
          $environment = Get-Content .env -Raw
          $environment -replace '(?m)^DOCKER_ARGS_WINDOWS=.*$', 'DOCKER_ARGS_WINDOWS=--isolation=hyperv' | Set-Content .env
          New-Item -ItemType Directory -Path .reports/powershell-core -Force | Out-Null
          Copy-Item tests/PowerShellCore.Tests.ps1 .reports/powershell-core/
          # Keep fixture paths relative to the test file, as in the complete suite.
          Copy-Item tests/fixtures .reports/powershell-core/fixtures -Recurse
          Copy-Item .jenkins .reports/.jenkins -Recurse
          pwsh ./.jenkins/Invoke-IntegrationTests.ps1 -Namespace tmp -Context windows -Variant ${{ matrix.variant }} -TestsPath .reports/powershell-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Store contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: powershell-contract-${{ matrix.variant }}
          path: .reports/report.xml
          if-no-files-found: warn
